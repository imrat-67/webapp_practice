<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Universe — Interactive Knowledge Tree</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #07090f;
    --bg2: #0d1117;
    --surface: #111827;
    --border: #1f2d3d;
    --accent1: #00f5c4;
    --accent2: #7b5cf0;
    --accent3: #f5a623;
    --accent4: #e83a6e;
    --accent5: #3ab4f5;
    --text: #e2e8f0;
    --muted: #64748b;
    --panel-w: 420px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* ── TOP BAR ── */
  #topbar {
    position: fixed; top:0; left:0; right:0; z-index:100;
    height: 56px;
    background: rgba(7,9,15,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap:16px; padding: 0 20px;
  }
  #topbar h1 {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight:800;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    white-space:nowrap;
  }
  #search-wrap {
    flex:1; max-width:360px; position:relative;
  }
  #search {
    width:100%; padding: 7px 12px 7px 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text); font-family:'Space Mono',monospace; font-size:12px;
    outline:none; transition:.2s;
  }
  #search:focus { border-color: var(--accent1); }
  .search-icon {
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    color: var(--muted); font-size:14px; pointer-events:none;
  }
  #count-badge {
    font-size:11px; color:var(--muted);
    white-space:nowrap;
  }
  .topbar-btns { display:flex; gap:8px; margin-left:auto; }
  .topbar-btns button {
    background: var(--surface); border:1px solid var(--border);
    color:var(--text); font-family:'Space Mono',monospace; font-size:11px;
    padding:5px 12px; border-radius:6px; cursor:pointer; transition:.2s;
  }
  .topbar-btns button:hover { border-color:var(--accent1); color:var(--accent1); }
  .topbar-btns button.active { border-color:var(--accent1); color:var(--accent1); background:#001a13; }

  /* ── CANVAS AREA ── */
  #canvas-wrap {
    position: fixed; top:56px; left:0; right:0; bottom:0;
    overflow: hidden; cursor: grab;
  }
  #canvas-wrap.grabbing { cursor: grabbing; }
  #tree-root {
    position: absolute;
    transform-origin: 0 0;
    padding: 60px 40px 200px 40px;
  }

  /* ── LEGEND ── */
  #legend {
    position:fixed; bottom:20px; left:20px; z-index:50;
    background: rgba(13,17,23,.88); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; display:flex; flex-direction:column; gap:6px;
  }
  #legend .leg-title { font-size:10px; color:var(--muted); margin-bottom:2px; }
  .leg-item { display:flex; align-items:center; gap:8px; font-size:11px; }
  .leg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  /* ── MINIMAP ── */
  #minimap {
    position:fixed; bottom:20px; right:20px; z-index:50;
    width:140px; height:90px;
    background: rgba(13,17,23,.88); backdrop-filter:blur(8px);
    border:1px solid var(--border); border-radius:8px;
    overflow:hidden; display:none;
  }
  #minimap canvas { width:100%; height:100%; }

  /* ── NODE STYLES ── */
  .node {
    display: inline-flex; flex-direction:column;
    vertical-align: top;
    position: relative;
  }

  .node-header {
    display: flex; align-items:center; gap:8px;
    cursor: pointer; user-select:none;
    padding: 8px 14px 8px 12px;
    border-radius: 10px;
    border: 1.5px solid transparent;
    transition: all .18s;
    position: relative; z-index:1;
    white-space: nowrap;
    max-width: 280px;
  }
  .node-header:hover { transform: translateY(-1px); }

  .node-icon { font-size:16px; flex-shrink:0; }
  .node-label {
    font-family:'Syne',sans-serif;
    font-weight:700; flex:1;
    overflow:hidden; text-overflow:ellipsis;
  }
  .node-count {
    font-size:10px; color:var(--muted);
    background: rgba(255,255,255,.06);
    padding:1px 6px; border-radius:20px; flex-shrink:0;
  }
  .node-toggle {
    font-size:10px; color:var(--muted); flex-shrink:0;
    transition: transform .2s;
    width:12px; text-align:center;
  }
  .node-toggle.open { transform: rotate(90deg); }

  /* DEPTH-BASED SIZING */
  .depth-0 > .node-header { font-size:15px; padding:12px 18px; border-radius:14px; }
  .depth-1 > .node-header { font-size:13px; }
  .depth-2 > .node-header { font-size:12px; }
  .depth-3 > .node-header { font-size:11px; padding:6px 12px; }
  .depth-4 > .node-header { font-size:10.5px; padding:5px 10px; }

  .node-children {
    display:none;
    margin-left: 22px;
    padding-left: 16px;
    border-left: 1.5px solid var(--border);
    margin-top: 4px;
    flex-direction: column; gap: 4px;
  }
  .node-children.open { display:flex; }

  /* HIGHLIGHT */
  .node-header.highlighted { outline:2px solid var(--accent3); outline-offset:2px; }
  .node-header.search-match { background: rgba(245,166,35,.12) !important; border-color: var(--accent3) !important; }
  .node-header.search-hidden { opacity:.18; }

  /* ── CATEGORY COLORS ── */
  .cat-prog { --c: #00f5c4; }
  .cat-markup { --c: #f5a623; }
  .cat-query { --c: #3ab4f5; }
  .cat-style { --c: #e83a6e; }
  .cat-hw { --c: #7b5cf0; }
  .cat-os { --c: #f06d3a; }
  .cat-net { --c: #3af0a0; }
  .cat-data { --c: #d0f53a; }
  .cat-shell { --c: #f53ad0; }
  .cat-template { --c: #3ad0f5; }
  .cat-config { --c: #f5d03a; }
  .cat-asm { --c: #ff6b6b; }
  .cat-func { --c: #a8f53a; }
  .cat-proto { --c: #f53a7b; }
  .cat-elex { --c: #c77dff; }

  .node-header {
    background: rgba(255,255,255,.03);
    border-color: color-mix(in srgb, var(--c, #444) 30%, transparent);
    color: var(--text);
  }
  .node-header:hover, .node-header.active {
    background: color-mix(in srgb, var(--c, #444) 12%, transparent);
    border-color: var(--c, #444);
    color: color-mix(in srgb, var(--c, #444) 80%, white);
    box-shadow: 0 0 14px color-mix(in srgb, var(--c, #444) 20%, transparent);
  }
  .node-icon { color: var(--c, var(--muted)); }

  /* ── DETAIL PANEL ── */
  #panel {
    position:fixed; top:56px; right:-480px; bottom:0;
    width: var(--panel-w);
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display:flex; flex-direction:column;
    transition: right .3s cubic-bezier(.4,0,.2,1);
    z-index:200; overflow:hidden;
  }
  #panel.open { right:0; }

  #panel-header {
    padding:20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display:flex; align-items:flex-start; gap:12px;
  }
  #panel-icon { font-size:32px; flex-shrink:0; }
  #panel-title-wrap { flex:1; }
  #panel-title {
    font-family:'Syne',sans-serif; font-size:18px; font-weight:800;
    line-height:1.2; margin-bottom:4px;
  }
  #panel-breadcrumb { font-size:10px; color:var(--muted); }
  #panel-close {
    background:none; border:none; color:var(--muted);
    font-size:20px; cursor:pointer; padding:0; flex-shrink:0;
    line-height:1; transition:.2s;
  }
  #panel-close:hover { color:var(--accent4); }

  #panel-body { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  #panel-body::-webkit-scrollbar { width:4px; }
  #panel-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .panel-section {}
  .panel-label {
    font-size:10px; color:var(--accent1); letter-spacing:.12em; text-transform:uppercase;
    margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .panel-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .panel-text { font-size:12.5px; line-height:1.7; color:#b0bec5; }
  .panel-text strong { color:var(--text); }

  .example-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip {
    font-size:11px; padding:4px 10px; border-radius:20px;
    background: rgba(255,255,255,.06); border:1px solid var(--border);
    cursor:default; transition:.15s;
  }
  .chip:hover { border-color:var(--c, #444); color:var(--c, var(--text)); }
  .chip.chip-lang { border-color: color-mix(in srgb, var(--c,#444) 50%, transparent); }

  .why-box {
    background: rgba(123,92,240,.08);
    border:1px solid rgba(123,92,240,.25);
    border-radius:8px; padding:12px 14px;
    font-size:12px; line-height:1.7; color:#b0c4de;
  }
  .why-box em { color: var(--accent2); font-style:normal; font-weight:700; }

  .lang-card {
    background: var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:12px 14px;
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    transition:.15s;
  }
  .lang-card:hover { border-color:var(--c, #444); }
  .lang-card-icon { font-size:20px; flex-shrink:0; }
  .lang-card-name { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; margin-bottom:2px; }
  .lang-card-desc { font-size:11px; color:var(--muted); line-height:1.5; }
  .lang-cards { display:flex; flex-direction:column; gap:8px; }

  /* YEAR BADGE */
  .year-badge {
    display:inline-block; font-size:10px; padding:2px 8px;
    border-radius:20px; border:1px solid; margin-left:6px; vertical-align:middle;
  }

  /* TOAST */
  #toast {
    position:fixed; bottom:70px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--accent1); color:#000; font-size:12px; font-weight:700;
    padding:8px 18px; border-radius:20px; opacity:0;
    transition:all .3s; pointer-events:none; z-index:999;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TREE RENDERER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let nodeMap = {};
let totalNodes = 0;

function countChildren(node) {
  let n = 1;
  if(node.children) node.children.forEach(c => n += countChildren(c));
  return n;
}

function buildNode(data, depth=0, breadcrumb=[]) {
  nodeMap[data.id] = data;
  totalNodes++;

  const bc = [...breadcrumb, data.label];
  const hasChildren = data.children && data.children.length > 0;
  const childCount = hasChildren ? countChildren(data) - 1 : 0;

  const el = document.createElement('div');
  el.className = `node depth-${Math.min(depth,4)} cat-${data.cat || 'prog'}`;
  el.dataset.id = data.id;
  el.dataset.depth = depth;
  data._breadcrumb = bc.join(' › ');

  const header = document.createElement('div');
  header.className = 'node-header';
  header.dataset.id = data.id;
  header.innerHTML = `
    <span class="node-icon">${data.icon || '●'}</span>
    <span class="node-label">${data.label}</span>
    ${childCount > 0 ? `<span class="node-count">${childCount}</span>` : ''}
    ${hasChildren ? `<span class="node-toggle">▶</span>` : ''}
  `;

  header.addEventListener('click', e => {
    e.stopPropagation();
    // toggle
    if(hasChildren) {
      const ch = el.querySelector(':scope > .node-children');
      const tog = header.querySelector('.node-toggle');
      const isOpen = ch.classList.contains('open');
      ch.classList.toggle('open', !isOpen);
      tog.classList.toggle('open', !isOpen);
    }
    // show detail
    showPanel(data);
    document.querySelectorAll('.node-header.active').forEach(h => h.classList.remove('active'));
    header.classList.add('active');
  });

  el.appendChild(header);

  if(hasChildren) {
    const childWrap = document.createElement('div');
    childWrap.className = 'node-children';
    // auto-open depth 0
    if(depth === 0) childWrap.classList.add('open');

    data.children.forEach(c => {
      childWrap.appendChild(buildNode(c, depth+1, bc));
    });
    el.appendChild(childWrap);

    // update toggle
    if(depth === 0) {
      header.querySelector('.node-toggle').classList.add('open');
    }
  }

  return el;
}

function renderTree() {
  const root = document.getElementById('tree-root');
  root.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start;';

  DATA.forEach(cat => {
    const node = buildNode(cat, 0, []);
    wrap.appendChild(node);
  });
  root.appendChild(wrap);

  document.getElementById('count-badge').textContent = `${totalNodes} nodes`;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PANEL
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function showPanel(data) {
  const panel = document.getElementById('panel');
  document.getElementById('panel-icon').textContent = data.icon || '📦';
  document.getElementById('panel-title').textContent = data.label;
  document.getElementById('panel-breadcrumb').textContent = data._breadcrumb || data.label;

  const body = document.getElementById('panel-body');
  body.innerHTML = '';

  const catClass = `cat-${data.cat || 'prog'}`;

  // Year badge
  let yearHTML = data.year ? `<span class="year-badge" style="border-color:var(--c);color:var(--c)">Since ${data.year}</span>` : '';

  // WHAT IS IT
  if(data.what) {
    const sec = document.createElement('div');
    sec.className = `panel-section ${catClass}`;
    sec.innerHTML = `
      <div class="panel-label">🔍 কী এটা ${yearHTML}</div>
      <p class="panel-text">${data.what}</p>
    `;
    body.appendChild(sec);
  }

  // WHY THIS CATEGORY
  if(data.why) {
    const sec = document.createElement('div');
    sec.className = 'panel-section';
    sec.innerHTML = `
      <div class="panel-label">💡 কেন এই category তে</div>
      <div class="why-box">${data.why.replace(/\b(important|standard|dominant|foundation|backbone|center|champion|primary|official|universal|critical)\b/gi, m => `<em>${m}</em>`)}</div>
    `;
    body.appendChild(sec);
  }

  // EXAMPLES
  if(data.examples && data.examples.length) {
    const sec = document.createElement('div');
    sec.className = `panel-section ${catClass}`;
    sec.innerHTML = `<div class="panel-label">📌 Real-world ব্যবহার</div>
      <div class="example-chips">${data.examples.map(e => `<span class="chip chip-lang">${e}</span>`).join('')}</div>`;
    body.appendChild(sec);
  }

  // LANGUAGE CARDS
  if(data.langs && data.langs.length) {
    const sec = document.createElement('div');
    sec.className = `panel-section ${catClass}`;
    sec.innerHTML = `<div class="panel-label">🌟 Notable Examples</div>`;
    const cards = document.createElement('div');
    cards.className = 'lang-cards';
    data.langs.forEach(l => {
      const card = document.createElement('div');
      card.className = `lang-card ${catClass}`;
      card.innerHTML = `<div class="lang-card-icon">${l.icon}</div>
        <div><div class="lang-card-name">${l.name}</div><div class="lang-card-desc">${l.desc}</div></div>`;
      card.addEventListener('click', () => { toast(`Copied: ${l.name}`); navigator.clipboard?.writeText(l.name); });
      cards.appendChild(card);
    });
    sec.appendChild(cards);
    body.appendChild(sec);
  }

  // CHILDREN COUNT
  if(data.children && data.children.length) {
    const sec = document.createElement('div');
    sec.className = 'panel-section';
    sec.innerHTML = `<div class="panel-label">📂 Sub-categories</div>
      <div class="example-chips">${data.children.map(c => `<span class="chip">${c.icon} ${c.label}</span>`).join('')}</div>`;
    body.appendChild(sec);
  }

  panel.classList.add('open');
}

document.getElementById('panel-close').addEventListener('click', () => {
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.node-header.active').forEach(h => h.classList.remove('active'));
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// PAN & ZOOM
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let tx=20, ty=20, scale=1;
const wrap = document.getElementById('canvas-wrap');
const treeRoot = document.getElementById('tree-root');

function applyTransform() {
  treeRoot.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
applyTransform();

let dragging=false, startX=0, startY=0, startTX=0, startTY=0;
wrap.addEventListener('mousedown', e => {
  if(e.target.closest('.node-header')) return;
  dragging=true; wrap.classList.add('grabbing');
  startX=e.clientX; startY=e.clientY; startTX=tx; startTY=ty;
});
document.addEventListener('mousemove', e => {
  if(!dragging) return;
  tx = startTX + (e.clientX - startX);
  ty = startTY + (e.clientY - startY);
  applyTransform();
});
document.addEventListener('mouseup', () => { dragging=false; wrap.classList.remove('grabbing'); });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.min(Math.max(scale * delta, 0.2), 3);
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, {passive:false});

// touch
let touches=[], touchDist=0;
wrap.addEventListener('touchstart', e => {
  touches = Array.from(e.touches);
  if(touches.length === 2) touchDist = Math.hypot(touches[0].clientX-touches[1].clientX, touches[0].clientY-touches[1].clientY);
  if(touches.length === 1 && !e.target.closest('.node-header')) { startX=touches[0].clientX; startY=touches[0].clientY; startTX=tx; startTY=ty; dragging=true; }
}, {passive:true});
wrap.addEventListener('touchmove', e => {
  const t = Array.from(e.touches);
  if(t.length===2) {
    const d = Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
    scale = Math.min(Math.max(scale * d/touchDist, 0.2), 3);
    touchDist=d; applyTransform();
  } else if(t.length===1 && dragging) {
    tx=startTX+(t[0].clientX-startX); ty=startTY+(t[0].clientY-startY); applyTransform();
  }
}, {passive:true});
wrap.addEventListener('touchend', () => dragging=false);

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// SEARCH
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function matchNode(node, q) {
  const fields = [node.label, node.what, node.why, ...(node.examples||[]), ...(node.langs||[]).map(l=>l.name+' '+l.desc)].join(' ').toLowerCase();
  return fields.includes(q);
}

document.getElementById('search').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.node-header').forEach(h => {
    h.classList.remove('search-match','search-hidden');
  });
  if(!q) return;
  document.querySelectorAll('.node').forEach(nodeEl => {
    const id = nodeEl.dataset.id;
    const data = nodeMap[id];
    if(!data) return;
    const header = nodeEl.querySelector(':scope > .node-header');
    if(matchNode(data, q)) {
      header.classList.add('search-match');
      // open parents
      let parent = nodeEl.parentElement;
      while(parent) {
        if(parent.classList?.contains('node-children')) parent.classList.add('open');
        if(parent.classList?.contains('node')) {
          const ph = parent.querySelector(':scope > .node-header');
          const tog = ph?.querySelector('.node-toggle');
          if(tog) tog.classList.add('open');
        }
        parent = parent.parentElement;
      }
    }
  });
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// BUTTONS
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.getElementById('btn-expand-all').addEventListener('click', () => {
  document.querySelectorAll('.node-children').forEach(c => c.classList.add('open'));
  document.querySelectorAll('.node-toggle').forEach(t => t.classList.add('open'));
});
document.getElementById('btn-collapse-all').addEventListener('click', () => {
  document.querySelectorAll('.node-children').forEach(c => c.classList.remove('open'));
  document.querySelectorAll('.node-toggle').forEach(t => t.classList.remove('open'));
  // re-open depth 0
  document.querySelectorAll('.node.depth-0 > .node-children').forEach(c => {
    c.classList.add('open');
    c.parentElement.querySelector('.node-toggle')?.classList.add('open');
  });
});
document.getElementById('btn-reset-view').addEventListener('click', () => {
  tx=20; ty=20; scale=1; applyTransform();
});

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// TOAST
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// INIT
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
renderTree();
