<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Modular Circle Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Hind+Siliguri:wght@400;600;700&display=swap');

  :root{
    --bg:#0d1117;
    --panel:#151b23;
    --line:#2a3340;
    --accent:#ffb454;   /* mod amber */
    --accent2:#5ee6c9;  /* result teal */
    --text:#e6edf3;
    --dim:#7d8590;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Hind Siliguri','JetBrains Mono',monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 12px 60px;
  }
  h1{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;
    font-size:1.4rem;
    letter-spacing:-0.5px;
    margin:6px 0 2px;
  }
  h1 span{color:var(--accent);}
  .sub{color:var(--dim);font-size:0.85rem;margin-bottom:18px;text-align:center;max-width:480px;}

  .controls{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    justify-content:center;
    max-width:680px;
    width:100%;
  }
  .field{display:flex;flex-direction:column;gap:4px;}
  label{font-size:0.72rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.06em;}
  input[type=number]{
    width:70px;
    background:#0d1117;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:1rem;
  }
  select{
    background:#0d1117;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:8px;
    font-family:'Hind Siliguri',sans-serif;
    font-size:0.9rem;
  }
  button{
    background:var(--accent);
    color:#10151c;
    border:none;
    padding:9px 18px;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    font-family:'Hind Siliguri',sans-serif;
    font-size:0.9rem;
    transition:transform .15s, box-shadow .15s;
  }
  button:hover{transform:translateY(-1px); box-shadow:0 4px 14px rgba(255,180,84,0.25);}
  button:disabled{opacity:0.35; cursor:not-allowed; transform:none; box-shadow:none;}

  .stage{
    margin-top:22px;
    position:relative;
    width:min(92vw,560px);
    height:min(92vw,560px);
  }
  svg{width:100%;height:100%;overflow:visible;}

  .node circle{
    fill:#1c2430;
    stroke:var(--line);
    stroke-width:2;
    transition:fill .25s, stroke .25s;
  }
  .node text{
    fill:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:700;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }
  .node.from circle{fill:var(--accent); stroke:var(--accent);}
  .node.from text{fill:#10151c;}
  .node.to circle{fill:var(--accent2); stroke:var(--accent2);}
  .node.to text{fill:#10151c;}
  .node.both circle{
    fill:var(--accent);
    stroke:var(--accent2);
    stroke-width:3;
  }

  .arrow{
    stroke:var(--accent);
    stroke-width:2;
    fill:none;
    opacity:0.85;
    marker-end:url(#arrowhead);
  }
  .selfloop{stroke-dasharray:4 3;}

  .readout{
    margin-top:18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 18px;
    max-width:560px;
    width:min(92vw,560px);
    font-family:'JetBrains Mono',monospace;
    font-size:0.92rem;
    line-height:1.65;
    min-height:30px;
  }
  .readout .hl{color:var(--accent); font-weight:700;}
  .readout .hl2{color:var(--accent2); font-weight:700;}
  .err{color:#ff6b6b; font-family:'Hind Siliguri',sans-serif;}

  .legend{
    display:flex;
    gap:18px;
    margin-top:14px;
    font-size:0.78rem;
    color:var(--dim);
    flex-wrap:wrap;
    justify-content:center;
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>

<h1>Modular <span>Circle</span> Visualizer</h1>
<div class="sub">n বক্সের সার্কেলে mod n এর ম্যাপিং দেখো — multiply, add, বা inverse সিলেক্ট করে animate করো।</div>

<div class="controls">
  <div class="field">
    <label>n (mod)</label>
    <input type="number" id="nInput" value="7" min="2" max="36">
  </div>
  <div class="field">
    <label>operation</label>
    <select id="opSelect">
      <option value="mul">×k mod n</option>
      <option value="add">+k mod n</option>
      <option value="inv">k⁻¹ mod n</option>
    </select>
  </div>
  <div class="field" id="kField">
    <label>k</label>
    <input type="number" id="kInput" value="4" min="0" max="35">
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="buildBtn">Build circle</button>
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="animBtn">▶ Animate all</button>
  </div>
</div>

<div class="stage"><svg id="svg" viewBox="-260 -260 520 520">
  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ffb454"></path>
    </marker>
  </defs>
  <g id="circleGroup"></g>
</svg></div>

<div class="readout" id="readout">n=7, operation = ×4 mod 7 সিলেক্ট করা আছে। কোনো বক্সে ক্লিক করো অথবা Animate চাপো।</div>

<div class="legend">
  <span><span class="dot" style="background:var(--accent)"></span> input (from)</span>
  <span><span class="dot" style="background:var(--accent2)"></span> output (to)</span>
  <span><span class="dot" style="background:#1c2430;border:2px solid var(--line)"></span> idle</span>
</div>

<script>
const svgNS = "http://www.w3.org/2000/svg";
const group = document.getElementById('circleGroup');
const readout = document.getElementById('readout');
const nInput = document.getElementById('nInput');
const kInput = document.getElementById('kInput');
const opSelect = document.getElementById('opSelect');
const kField = document.getElementById('kField');

let n = 7;
let nodePos = [];
let animTimer = null;

function gcd(a,b){ while(b){ [a,b]=[b,a%b]; } return a; }

function modInverse(a, m){
  a = ((a % m) + m) % m;
  for(let x=1; x<m; x++){
    if((a*x) % m === 1) return x;
  }
  return null;
}

function buildCircle(){
  n = Math.max(2, Math.min(36, parseInt(nInput.value)||7));
  nInput.value = n;
  group.innerHTML = '';
  nodePos = [];

  const R = 210;
  for(let i=0;i<n;i++){
    const angle = (-Math.PI/2) + (2*Math.PI*i/n);
    const x = R*Math.cos(angle);
    const y = R*Math.sin(angle);
    nodePos.push({x,y});

    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('class','node');
    g.setAttribute('data-i', i);
    g.style.cursor = 'pointer';

    const c = document.createElementNS(svgNS,'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 20);
    g.appendChild(c);

    const t = document.createElementNS(svgNS,'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.textContent = i;
    g.appendChild(t);

    g.addEventListener('click', ()=>showSingle(i));
    group.appendChild(g);
  }

  // faint circle guide
  const guide = document.createElementNS(svgNS,'circle');
  guide.setAttribute('cx',0); guide.setAttribute('cy',0); guide.setAttribute('r',R);
  guide.setAttribute('fill','none'); guide.setAttribute('stroke','#1f2733'); guide.setAttribute('stroke-width','1');
  group.insertBefore(guide, group.firstChild);

  clearArrows();
  clearHighlights();
  readout.innerHTML = `n=${n} এর সার্কেল তৈরি হলো। বক্সে ক্লিক করো single mapping দেখতে, অথবা Animate চাপো সবগুলো দেখতে।`;
}

function clearArrows(){
  group.querySelectorAll('.arrow').forEach(e=>e.remove());
}
function clearHighlights(){
  group.querySelectorAll('.node').forEach(el=>el.setAttribute('class','node'));
}

function getOpResult(i){
  const op = opSelect.value;
  let k = parseInt(kInput.value) || 0;
  if(op === 'mul'){
    return { val: ((i*k)%n+n)%n, label: `${i} × ${k} mod ${n}` };
  } else if(op === 'add'){
    return { val: ((i+k)%n+n)%n, label: `${i} + ${k} mod ${n}` };
  } else {
    // inverse: only makes sense for i, returns i^-1 mod n if exists
    if(gcd(((i%n)+n)%n, n) !== 1){
      return { val: null, label: `${i}⁻¹ mod ${n} (নেই, কারণ gcd(${i},${n}) ≠ 1)` };
    }
    const inv = modInverse(i, n);
    return { val: inv, label: `${i}⁻¹ mod ${n}` };
  }
}

function drawArrow(fromI, toI){
  const a = nodePos[fromI], b = nodePos[toI];
  if(fromI === toI){
    // self loop: small loop above the node
    const lx = a.x, ly = a.y;
    const dir = Math.atan2(ly, lx);
    const ox = lx + 26*Math.cos(dir), oy = ly + 26*Math.sin(dir);
    const path = document.createElementNS(svgNS,'path');
    const cx1 = ox + 24*Math.cos(dir+1.2), cy1 = oy + 24*Math.sin(dir+1.2);
    const cx2 = ox + 24*Math.cos(dir-1.2), cy2 = oy + 24*Math.sin(dir-1.2);
    path.setAttribute('d', `M${lx+20*Math.cos(dir)},${ly+20*Math.sin(dir)} C ${cx1},${cy1} ${cx2},${cy2} ${lx+20*Math.cos(dir+0.3)},${ly+20*Math.sin(dir+0.3)}`);
    path.setAttribute('class','arrow selfloop');
    group.appendChild(path);
    return;
  }
  // curve slightly through center for visual clarity
  const mx = (a.x+b.x)/2 * 0.35;
  const my = (a.y+b.y)/2 * 0.35;
  // shrink endpoints toward node edge (radius 20)
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx,dy);
  const ux = dx/dist, uy = dy/dist;
  const sx = a.x + ux*22, sy = a.y + uy*22;
  const ex = b.x - ux*24, ey = b.y - uy*24;

  const path = document.createElementNS(svgNS,'path');
  path.setAttribute('d', `M${sx},${sy} Q ${mx},${my} ${ex},${ey}`);
  path.setAttribute('class','arrow');
  group.appendChild(path);
}

function highlightNode(i, cls){
  const el = group.querySelector(`.node[data-i="${i}"]`);
  if(!el) return;
  const cur = el.getAttribute('class');
  if(cur.includes('from') && cls==='to') el.setAttribute('class','node both');
  else if(cur.includes('to') && cls==='from') el.setAttribute('class','node both');
  else if(!cur.includes('both')) el.setAttribute('class', 'node '+cls);
}

function showSingle(i){
  clearArrows();
  clearHighlights();
  const res = getOpResult(i);
  highlightNode(i, 'from');
  if(res.val !== null && res.val !== undefined){
    highlightNode(res.val, 'to');
    drawArrow(i, res.val);
    readout.innerHTML = `<span class="hl">${i}</span> → ${res.label} = <span class="hl2">${res.val}</span>`;
  } else {
    readout.innerHTML = `<span class="hl">${i}</span> → ${res.label} <span class="err">— এই বক্সের ইনভার্স নেই</span>`;
  }
}

function animateAll(){
  clearArrows();
  clearHighlights();
  if(animTimer) clearInterval(animTimer);
  let i = 0;
  const btn = document.getElementById('animBtn');
  btn.disabled = true;
  animTimer = setInterval(()=>{
    if(i >= n){
      clearInterval(animTimer);
      btn.disabled = false;
      return;
    }
    clearArrows();
    clearHighlights();
    showSingle(i);
    i++;
  }, 750);
}

opSelect.addEventListener('change', ()=>{
  kField.style.display = opSelect.value === 'inv' ? 'none' : 'flex';
  clearArrows(); clearHighlights();
});
document.getElementById('buildBtn').addEventListener('click', buildCircle);
document.getElementById('animBtn').addEventListener('click', animateAll);

buildCircle();
</script>
</body>
</html>
