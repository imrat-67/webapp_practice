<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 100 — Before DSA</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090e;
    --surface: #0f0f17;
    --card: #13131d;
    --border: #1f1f30;
    --border2: #2a2a40;
    --accent: #e8ff59;
    --accent2: #59ffc8;
    --accent3: #ff5959;
    --accent4: #59a8ff;
    --text: #eeeef5;
    --muted: #55556a;
    --muted2: #7777a0;
    --done-bg: #0a1a12;
    --done-border: #0f3020;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* ── grid bg ── */
  body::before {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(232,255,89,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,89,.025) 1px, transparent 1px);
    background-size:48px 48px;
    pointer-events:none; z-index:0;
  }

  .wrapper { max-width:900px; margin:0 auto; padding:52px 20px 100px; position:relative; z-index:1; }

  /* ── HEADER ── */
  .header { margin-bottom:44px; }
  .header-pill {
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid var(--border2);
    padding:6px 14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:3px; color:var(--muted2);
    text-transform:uppercase; margin-bottom:20px;
  }
  .header-pill span { color:var(--accent); }
  h1 {
    font-size: clamp(44px, 10vw, 88px);
    font-weight:900; line-height:.9; letter-spacing:-4px;
  }
  h1 em { font-style:normal; color:var(--accent); }
  .sub {
    margin-top:16px; color:var(--muted2);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; line-height:1.7; max-width:480px;
  }

  /* ── STATS ── */
  .stats {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px; margin:32px 0;
  }
  @media(max-width:540px){ .stats { grid-template-columns:repeat(2,1fr); } }
  .stat {
    background:var(--card); border:1px solid var(--border);
    padding:18px 16px; text-align:center;
  }
  .stat-n {
    font-family:'IBM Plex Mono', monospace;
    font-size:30px; font-weight:700; line-height:1;
  }
  .stat-l {
    font-size:10px; color:var(--muted2); margin-top:5px;
    letter-spacing:2px; text-transform:uppercase;
  }

  /* ── PROGRESS BAR ── */
  .bar-wrap {
    height:3px; background:var(--border); margin-bottom:36px; position:relative; overflow:visible;
  }
  .bar-fill {
    height:100%;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    transition:width .6s cubic-bezier(.4,0,.2,1);
    width:0%; position:relative;
  }
  .bar-fill::after {
    content:''; position:absolute; right:-5px; top:-4px;
    width:11px; height:11px; border-radius:50%;
    background:var(--accent2); box-shadow:0 0 10px var(--accent2);
  }

  /* ── FILTERS ── */
  .filters { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:34px; }
  .fb {
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; letter-spacing:1px; padding:5px 11px;
    border:1px solid var(--border); background:transparent;
    color:var(--muted2); cursor:pointer; transition:all .15s;
    text-transform:uppercase; border-radius:2px;
  }
  .fb:hover { border-color:var(--accent); color:var(--accent); }
  .fb.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:700; }

  /* ── DONE BANNER ── */
  .done-banner {
    display:none; text-align:center; padding:26px;
    border:1px solid var(--accent2);
    background:rgba(89,255,200,.04); margin-bottom:30px;
  }
  .done-banner.show { display:block; }
  .done-banner h2 { font-size:20px; color:var(--accent2); font-weight:900; }
  .done-banner p { color:var(--muted2); font-size:12px; margin-top:5px; font-family:'IBM Plex Mono',monospace; }

  /* ── SECTION ── */
  .section { margin-bottom:40px; }
  .sec-hd {
    display:flex; align-items:center; gap:12px;
    margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .sec-num {
    font-family:'IBM Plex Mono',monospace; font-size:9px;
    color:var(--muted); letter-spacing:2px;
  }
  .sec-name {
    font-size:12px; font-weight:700; letter-spacing:2.5px;
    text-transform:uppercase; color:var(--text);
  }
  .sec-cnt {
    font-family:'IBM Plex Mono',monospace; font-size:9px;
    color:var(--muted2); margin-left:auto;
    border:1px solid var(--border); padding:2px 8px;
  }

  /* ── PROBLEM CARD ── */
  .prob {
    border:1px solid var(--border);
    background:var(--card);
    margin-bottom:6px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    position:relative; overflow:hidden;
  }
  .prob::before {
    content:''; position:absolute; left:0; top:0; bottom:0;
    width:3px; background:var(--border); transition:background .15s;
  }
  .prob:hover { border-color:var(--border2); }
  .prob:hover::before { background:var(--accent); }
  .prob.done { background:var(--done-bg); border-color:var(--done-border); }
  .prob.done::before { background:var(--accent2); }

  /* card top row */
  .prob-top {
    display:flex; align-items:flex-start;
    gap:12px; padding:13px 14px 12px;
  }
  .prob-num {
    font-family:'IBM Plex Mono',monospace; font-size:10px;
    color:var(--muted); min-width:34px; text-align:right; padding-top:2px;
  }
  .prob-check {
    width:17px; height:17px; border:1.5px solid var(--border2);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:transparent; transition:all .15s;
    flex-shrink:0; margin-top:2px;
  }
  .prob.done .prob-check { background:var(--accent2); border-color:var(--accent2); color:#000; font-weight:700; }
  .prob-main { flex:1; }
  .prob-title {
    font-size:14px; font-weight:700; line-height:1.3;
    transition:color .15s;
  }
  .prob.done .prob-title { text-decoration:line-through; color:var(--muted); }
  .chip {
    font-family:'IBM Plex Mono',monospace; font-size:9px;
    letter-spacing:.5px; padding:2px 7px; border-radius:2px;
    text-transform:uppercase; white-space:nowrap;
    align-self:flex-start; flex-shrink:0; margin-top:2px;
  }
  /* chip colors */
  .c-io      { background:#0e1825; color:var(--accent4);  border:1px solid #1a3050; }
  .c-math    { background:#1a1030; color:#c480ff;          border:1px solid #301a50; }
  .c-logic   { background:#251810; color:#ff9f60;          border:1px solid #402a18; }
  .c-loop    { background:#101e12; color:#70e890;          border:1px solid #1a4020; }
  .c-func    { background:#121e10; color:#a0e870;          border:1px solid #203a18; }
  .c-string  { background:#251010; color:#ff7070;          border:1px solid #401818; }
  .c-list    { background:#101e10; color:#70e870;          border:1px solid #1a3a1a; }
  .c-dict    { background:#1e1e10; color:#e8e870;          border:1px solid #303018; }
  .c-set     { background:#101e1e; color:#70e8e8;          border:1px solid #1a3030; }
  .c-contest { background:#1e1410; color:#e89070;          border:1px solid #382010; }
  .c-pattern { background:#101018; color:#9090e8;          border:1px solid #1a1a30; }

  /* expandable detail */
  .prob-detail {
    display:none;
    padding:0 14px 14px 60px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
  }
  .prob-detail.open { display:block; }
  .det-row {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px; margin-top:10px;
  }
  @media(max-width:520px){ .det-row { grid-template-columns:1fr; } }
  .det-box {
    background:var(--surface); border:1px solid var(--border);
    padding:10px 12px;
  }
  .det-label {
    font-size:8px; letter-spacing:2px; text-transform:uppercase;
    color:var(--muted); margin-bottom:5px; display:flex; align-items:center; gap:5px;
  }
  .det-label::before {
    content:''; display:inline-block; width:6px; height:6px;
    border-radius:50%; background:currentColor;
  }
  .det-content { color:var(--text); line-height:1.65; font-size:11px; }
  .det-stmt { margin-top:10px; padding:10px 12px; background:var(--surface); border:1px solid var(--border); }
  .expand-hint {
    font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--muted);
    margin-left:auto; align-self:center; letter-spacing:1px; transition:color .15s;
    flex-shrink:0;
  }
  .prob:hover .expand-hint { color:var(--muted2); }
  .prob.open .expand-hint { color:var(--accent); }

  /* reset */
  .reset {
    font-family:'IBM Plex Mono',monospace; font-size:10px; padding:9px 22px;
    border:1px solid #2a1010; background:transparent; color:var(--accent3);
    cursor:pointer; letter-spacing:1px; text-transform:uppercase;
    transition:all .15s; display:block; margin:36px auto 0;
  }
  .reset:hover { background:#2a1010; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="header-pill">Before DSA · <span>Beginner</span> · 100 Problems</div>
    <h1>Python<br><em>100</em></h1>
    <p class="sub">// one problem at a time. click to expand.<br>// click the checkbox area to mark done.</p>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-done" style="color:var(--accent2)">0</div><div class="stat-l">Solved</div></div>
    <div class="stat"><div class="stat-n" id="s-left" style="color:var(--accent3)">100</div><div class="stat-l">Left</div></div>
    <div class="stat"><div class="stat-n" id="s-pct" style="color:var(--accent)">0%</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-n" id="s-next" style="color:var(--accent4); font-size:16px;">—</div><div class="stat-l">Next Up</div></div>
  </div>

  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>

  <div class="done-banner" id="doneBanner">
    <h2>🎉 All 100 Done — DSA awaits!</h2>
    <p>// solid foundation built. time to tackle data structures & algorithms.</p>
  </div>

  <div class="filters">
    <button class="fb active" data-f="all">All</button>
    <button class="fb" data-f="todo">Todo</button>
    <button class="fb" data-f="done">Done</button>
    <button class="fb" data-f="pattern">Patterns</button>
    <button class="fb" data-f="io">I/O</button>
    <button class="fb" data-f="math">Math</button>
    <button class="fb" data-f="logic">Logic</button>
    <button class="fb" data-f="loop">Loops</button>
    <button class="fb" data-f="func">Functions</button>
    <button class="fb" data-f="string">Strings</button>
    <button class="fb" data-f="list">Lists</button>
    <button class="fb" data-f="dict">Dict</button>
    <button class="fb" data-f="set">Sets</button>
    <button class="fb" data-f="contest">Contest</button>
  </div>

  <div id="list"></div>
  <button class="reset" onclick="resetAll()">↺ Reset All Progress</button>
</div>

<script>
const DATA = [

/* ════════════════════════════════════════════════

  output:"9\n5" },

{ id:5, sec:"01 · Input / Output & Variables", tag:"io",

  stmt:"Read three integers from one space-separated line. Print them each on a new line.",

{ id:9, sec:"02 · Math & Operators", tag:"math",

{ id:10, sec:"02 · Math & Operators", tag:"math",

{ id:11, sec:"02 · Math & Operators", tag:"math",

{ id:12, sec:"02 · Math & Operators", tag:"math",

════════════════════════════════════════════════ */
{ id:13, sec:"03 · Conditionals (if / elif / else)", tag:"logic",
  title:"Max of Two Numbers",
  stmt:"Read two numbers. Print the larger one. Do not use max().",

{ id:14, sec:"03 · Conditionals (if / elif / else)", tag:"logic",

  input:"4 9 2",

/* ──────────────────────────── State ─────────────────────────────── */
const SECS = [...new Set(DATA.map(p => p.sec))];
let done = JSON.parse(localStorage.getItem('py100v4') || '{}');
let curFilter = 'all';

function save() { localStorage.setItem('py100v4', JSON.stringify(done)); }

function updateStats() {
  const n = Object.values(done).filter(Boolean).length;
  document.getElementById('s-done').textContent = n;
  document.getElementById('s-left').textContent = 100 - n;
  document.getElementById('s-pct').textContent = n + '%';
  document.getElementById('bar').style.width = n + '%';
  document.getElementById('doneBanner').classList.toggle('show', n === 100);
  const next = DATA.find(p => !done[p.id]);
  document.getElementById('s-next').textContent = next ? '#' + String(next.id).padStart(3,'0') : '✓ All';
}

/* toggle done state — only when clicking check area / left edge */
function toggleDone(id, e) {
  e.stopPropagation();
  done[id] = !done[id];
  if (!done[id]) delete done[id];
  save(); render();
}

/* toggle expand — clicking the rest of the card */
function toggleExpand(id, e) {
  const card = document.getElementById('prob-' + id);
  const detail = document.getElementById('det-' + id);
  const isOpen = detail.classList.contains('open');
  detail.classList.toggle('open', !isOpen);
  card.classList.toggle('open', !isOpen);
}

function filter(f, el) {
  curFilter = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function resetAll() {
  if (confirm('Reset all progress?')) { done = {}; save(); render(); }
}

function formatIO(text) {
  return text.replace(/\n/g, '<br>');
}

function render() {
  updateStats();
  const list = document.getElementById('list');
  list.innerHTML = '';

  const secMap = {};
  SECS.forEach(s => secMap[s] = []);
  DATA.forEach(p => secMap[p.sec].push(p));

  SECS.forEach((sec, si) => {
    const probs = secMap[sec];
    const visible = probs.filter(p => {
      if (curFilter === 'all')  return true;
      if (curFilter === 'done') return !!done[p.id];
      if (curFilter === 'todo') return !done[p.id];
      return p.tag === curFilter;
    });
    if (!visible.length) return;

    const secDone = probs.filter(p => done[p.id]).length;
    const secEl = document.createElement('div');
    secEl.className = 'section';

    const secName = sec.split('·')[1]?.trim() || sec;
    secEl.innerHTML = `
      <div class="sec-hd">
        <span class="sec-num">${String(si+1).padStart(2,'0')}</span>
        <span class="sec-name">${secName}</span>
        <span class="sec-cnt">${secDone}/${probs.length}</span>
      </div>
    `;

    visible.forEach(p => {
      const isDone = !!done[p.id];
      const d = document.createElement('div');
      d.className = 'prob' + (isDone ? ' done' : '');
      d.id = 'prob-' + p.id;
      d.innerHTML = `
        <div class="prob-top" onclick="toggleExpand(${p.id}, event)">
          <span class="prob-num">#${String(p.id).padStart(3,'0')}</span>
          <div class="prob-check" onclick="toggleDone(${p.id}, event)">✓</div>
          <div class="prob-main">
            <div class="prob-title">${p.title}</div>
          </div>
          <span class="chip c-${p.tag}">${p.tag}</span>
          <span class="expand-hint">+ expand</span>
        </div>
        <div class="prob-detail" id="det-${p.id}">
          <div class="det-stmt">
            <div class="det-label" style="color:var(--accent4)">Problem Statement</div>
            <div class="det-content">${p.stmt}</div>
          </div>
          <div class="det-row">
            <div class="det-box">
              <div class="det-label" style="color:var(--accent)">Sample Input</div>
              <div class="det-content">${formatIO(p.input)}</div>
            </div>
            <div class="det-box">
              <div class="det-label" style="color:var(--accent2)">Expected Output</div>
              <div class="det-content">${formatIO(p.output)}</div>
            </div>
          </div>
        </div>
      `;
      secEl.appendChild(d);
    });

    list.appendChild(secEl);
  });
}

/* filter button listeners */
document.querySelectorAll('.fb').forEach(btn => {
  btn.addEventListener('click', () => filter(btn.dataset.f, btn));
});

render();
</script>
